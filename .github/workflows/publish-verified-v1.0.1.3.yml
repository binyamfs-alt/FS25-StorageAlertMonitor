name: Publish verified Storage Alert Monitor 1.0.1.3
on:
  push:
    branches: ['release/sam-1.0.1.3']
    paths: ['.github/workflows/publish-verified-v1.0.1.3.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 92b74df1cef36778e3fe2709bb3515d2d3118a98
      - name: Validate ZIP integrity
        run: python3 -c "import zipfile; z=zipfile.ZipFile('builds/FS25_z_StorageAlertMonitor.zip'); assert z.testzip() is None"
      - name: Publish verified source and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v1.0.1.3'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" 'builds/FS25_z_StorageAlertMonitor.zip' --clobber
            gh release edit "$tag" --draft=false --latest --title 'Storage Alert Monitor 1.0.1.3' --notes 'German menu and HUD translations, controls, hints, building categories and animal metrics. User confirmed the German layout in-game. Saved alert keys stay compatible.'
          else
            gh release create "$tag" 'builds/FS25_z_StorageAlertMonitor.zip' --target '92b74df1cef36778e3fe2709bb3515d2d3118a98' --latest --title 'Storage Alert Monitor 1.0.1.3' --notes 'German menu and HUD translations, controls, hints, building categories and animal metrics. User confirmed the German layout in-game. Saved alert keys stay compatible.'
          fi
